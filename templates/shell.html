<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #000000;
      --surface:     #1c1c1e;
      --surface2:    #2c2c2e;
      --surface3:    #3a3a3c;
      --border:      rgba(84,84,88,0.5);
      --accent:      #2e8a4e;
      --accent-light:#6ec989;
      --accent-dim:  rgba(46,138,78,0.16);
      --accent-border: rgba(46,138,78,0.35);
      --text:        #ffffff;
      --label2:      rgba(255,255,255,0.6);
      --label3:      rgba(255,255,255,0.3);
      --radius:      14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent-light); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 17px; color: var(--text);
      text-decoration: none;
    }
    .nav-logo img {
      width: 30px; height: 30px;
      border-radius: 7px;
    }
    .nav-links { display: flex; gap: 24px; font-size: 14px; }
    .nav-links a { color: var(--label2); }
    .nav-links a:hover { color: var(--text); text-decoration: none; }

    /* ── TELEGRAM STEPS ── */
    .tg-steps { display: flex; flex-direction: column; gap: 0; position: relative; }
    .tg-step { display: flex; gap: 20px; padding: 0 0 32px 0; position: relative; }
    .tg-step:last-child { padding-bottom: 0; }
    .tg-step-left { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .tg-step-circle {
      width: 44px; height: 44px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .tg-step-line {
      width: 1.5px; flex: 1; min-height: 24px;
      background: var(--border);
      margin: 6px 0;
    }
    .tg-step-body { padding-top: 8px; }
    .tg-step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px;
      background: var(--accent-dim);
      border-radius: 50%;
      font-size: 11px; font-weight: 700; color: var(--accent-light);
      margin-right: 6px;
    }
    .tg-step-title { font-size: 15px; font-weight: 600; display: inline; }
    .tg-step-desc { font-size: 14px; color: var(--label2); margin-top: 6px; line-height: 1.55; }
    .tg-highlight {
      display: inline-block;
      background: var(--accent-dim);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 13px; font-weight: 600;
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--accent-light);
      margin-top: 6px;
    }
    .tg-where-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-top: 32px;
      display: flex; gap: 16px; align-items: flex-start;
    }
    .tg-where-icon { font-size: 28px; flex-shrink: 0; }
    .tg-where-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .tg-where-desc { font-size: 14px; color: var(--label2); line-height: 1.55; }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 96px 24px 72px;
      max-width: 680px;
      margin: 0 auto;
    }
    .hero-logo {
      width: 96px; height: 96px;
      border-radius: 22px;
      margin: 0 auto 28px;
      display: block;
      box-shadow: 0 0 40px rgba(46,138,78,0.35);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent-light);
      font-size: 13px; font-weight: 500;
      padding: 5px 14px; border-radius: 99px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700; letter-spacing: -0.03em; line-height: 1.15;
      margin-bottom: 20px;
    }
    .hero h1 span { color: var(--accent-light); }
    .hero p { font-size: 17px; color: var(--label2); max-width: 520px; margin: 0 auto 36px; }
    .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 14px; font-size: 15px; font-weight: 500;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.82; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* ── SECTION ── */
    section { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
    section + section { padding-top: 0; }
    .section-label {
      font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent-light); margin-bottom: 12px;
    }
    .section-title {
      font-size: clamp(22px, 4vw, 32px); font-weight: 700;
      letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .section-sub { font-size: 16px; color: var(--label2); margin-bottom: 40px; }

    /* ── ROLES ── */
    .roles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .role-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .role-icon { font-size: 28px; margin-bottom: 12px; }
    .role-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .role-desc { font-size: 14px; color: var(--label2); line-height: 1.5; }
    .role-list { list-style: none; margin-top: 12px; }
    .role-list li {
      font-size: 13px; color: var(--label2);
      padding: 3px 0; display: flex; gap: 8px;
    }
    .role-list li::before { content: "✓"; color: var(--accent-light); flex-shrink: 0; }
    .role-list li.no::before { content: "✗"; color: var(--label3); }
    .role-list li.no { color: var(--label3); }

    /* ── PERMISSIONS TABLE ── */
    .perm-table-wrap { overflow-x: auto; margin-top: 40px; }
    .perm-table {
      width: 100%; border-collapse: collapse;
      font-size: 14px;
    }
    .perm-table th, .perm-table td {
      padding: 11px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .perm-table thead th {
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--label2);
      background: var(--surface);
    }
    .perm-table thead th:first-child { border-radius: var(--radius) 0 0 0; }
    .perm-table thead th:last-child  { border-radius: 0 var(--radius) 0 0; }
    .perm-table tbody tr:last-child td { border-bottom: none; }
    .perm-table tbody tr:hover { background: var(--surface2); }
    .perm-table td:first-child { color: var(--text); font-weight: 500; }
    .yes { color: var(--accent-light); font-weight: 600; }
    .pt-no { color: var(--label3); }

    /* ── INVITE FLOW ── */
    .invite-flow {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-top: 40px;
    }
    .invite-flow-title { font-size: 15px; font-weight: 600; margin-bottom: 20px; }
    .invite-steps { display: flex; flex-direction: column; gap: 14px; }
    .invite-step { display: flex; gap: 14px; align-items: flex-start; }
    .invite-step-num {
      width: 26px; height: 26px; flex-shrink: 0;
      background: var(--accent-dim); border: 1px solid var(--accent-border);
      color: var(--accent-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .invite-step-text { font-size: 14px; color: var(--label2); line-height: 1.55; padding-top: 3px; }
    .invite-step-text strong { color: var(--text); }

    /* ── STEPS ── */
    .steps { display: flex; flex-direction: column; }
    .step {
      display: flex; gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .step:last-child { border-bottom: none; }
    .step-num {
      width: 36px; height: 36px; flex-shrink: 0;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .step-body h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .step-body p { font-size: 14px; color: var(--label2); }
    .step-body code {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 13px;
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--accent-light);
      margin-top: 6px;
    }

    /* ── STATUS FLOW ── */
    .status-flow {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      margin-top: 24px;
    }
    .status-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 13px; font-weight: 500;
      color: var(--label2);
    }
    .status-chip.active {
      background: var(--accent-dim);
      border-color: var(--accent-border);
      color: var(--accent-light);
    }
    .status-arrow { color: var(--label3); font-size: 16px; }

    /* ── FAQ ── */
    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    details + details { margin-top: 8px; }
    summary {
      padding: 18px 20px;
      font-size: 15px; font-weight: 500;
      cursor: pointer;
      list-style: none;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--accent-light); font-size: 20px; flex-shrink: 0; }
    details[open] summary::after { content: "−"; }
    details[open] { background: var(--surface2); }
    .faq-body { padding: 0 20px 18px; font-size: 14px; color: var(--label2); line-height: 1.65; }
    .faq-body p + p { margin-top: 8px; }

    /* ── CONTACT ── */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 16px;
    }
    .contact-card h3 { font-size: 20px; font-weight: 600; }
    .contact-card p { font-size: 15px; color: var(--label2); max-width: 400px; }
    .contact-email {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent-light);
      padding: 10px 20px; border-radius: 10px;
      font-size: 15px; font-weight: 500;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 32px 24px;
      font-size: 13px; color: var(--label3);
    }
    footer a { color: var(--label3); }
    footer a:hover { color: var(--label2); }

    @media (max-width: 600px) {
      .nav-links { display: none; }
      .hero { padding: 64px 24px 48px; }
      .contact-card { padding: 24px; }
      .status-flow { gap: 6px; }
      .status-chip { font-size: 12px; padding: 4px 10px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <img src="logo.png" alt="GarageOS" />
    GarageOS
  </a>
  <div class="nav-links">
{{NAV_LINKS}}
  </div>
</nav>

{{SECTIONS}}

<footer>
  <p>{{FOOTER}}</p>
</footer>

</body>
</html>
